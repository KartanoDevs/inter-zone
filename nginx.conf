# nginx del frontend: sirve el bundle de Angular y reenvía /api al contenedor del servidor.
# TLS, dominio y HSTS NO se hacen aquí: los hace el proxy inverso del host (Nginx Proxy
# Manager), que solo necesita saber que este contenedor responde en el puerto 80.

# Content-Type correcto del manifiesto: nginx no lo trae en su mime.types y Chrome avisa
# ("Manifest: Line: 1, column: 1, Syntax error") si llega como application/octet-stream.
types {
  application/manifest+json  webmanifest;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Los cuerpos de la API son JSON de sistemas: pequeños. 2 MB sobra y acota el abuso.
  client_max_body_size 2m;

  # Compresión. Los .png y el .ico ya vienen comprimidos: no se recomprimen.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/javascript
    application/javascript application/json application/manifest+json
    image/svg+xml;

  # --- API ---------------------------------------------------------------------------
  # Va antes que el fallback a index.html: un /api/... inexistente devuelve el 404 JSON de
  # Express, nunca la SPA. Con esto la cookie iz_sesion es de primera parte y CORS deja de
  # intervenir (el servidor sigue emitiendo sus cabeceras; ya nadie las mira).
  location /api/ {
    proxy_pass http://servidor:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # El esquema real lo sabe el proxy del host (aquí dentro siempre es http). El servidor lo
    # necesita para `trust proxy`/SALTOS_PROXY (limitador de intentos).
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 30s;

    # Las add_header de location / no se heredan aquí (nginx las reemplaza por bloque, no las
    # acumula). El servidor Express ya emite nosniff/Referrer-Policy/Cache-Control, pero se
    # repiten aquí para que cualquier respuesta de nginx en esta ruta (un 502, un timeout) las
    # lleve igual. frame-ancestors: la API nunca se embebe.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Cache-Control          "no-store" always;
  }

  # --- Service worker ----------------------------------------------------------------
  # Match exacto: en nginx gana a la location por regex de más abajo. Un sw.js cacheado
  # rancio deja la aplicación congelada en una versión vieja para siempre, así que este
  # fichero NUNCA se cachea.
  location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options          "DENY" always;
  }

  # --- Recursos con hash en el nombre ------------------------------------------------
  # outputHashing "all" da main-PR4NHFPX.js / styles-M2IJVYRW.css: el nombre cambia con el
  # contenido, así que inmutables durante un año sin riesgo de servir algo viejo.
  location ~* "-[A-Za-z0-9]{8,}\.(?:js|css|woff2?)$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options          "DENY" always;
    access_log off;
  }

  # --- Recursos de public/ sin hash --------------------------------------------------
  # Iconos, favicon y manifest: los copia el builder tal cual, sin hash, así que un plazo
  # largo dejaría iconos viejos pegados. Una semana es el equilibrio.
  location ~* \.(?:png|ico|svg|webmanifest|woff2?)$ {
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options          "DENY" always;
    access_log off;
  }

  # --- La aplicación -----------------------------------------------------------------
  # InterZone no tiene router (toda la app vive en /), pero el fallback sigue haciendo
  # falta: es lo que devuelve el shell a una navegación que el service worker reintenta, y
  # lo que evita un 404 de nginx ante una URL inventada.
  location / {
    try_files $uri $uri/ /index.html;

    # index.html referencia los bundles con hash: si se cachea, el navegador seguiría
    # pidiendo los bundles del despliegue anterior. Siempre se revalida.
    add_header Cache-Control "no-cache, must-revalidate" always;

    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options          "DENY" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # CSP con las fuentes de Google todavía externas (index.html las carga desde
    # fonts.googleapis.com/fonts.gstatic.com). Angular inserta estilos en tiempo de
    # ejecución, de ahí 'unsafe-inline' en style-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  }
}
