<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>InterZone</title>
    <base href="/" />
    <!-- `viewport-fit=cover`: sin esto, `env(safe-area-inset-*)` siempre vale 0 en iOS y la app
       instalada no puede evitar el notch ni la barra de gestos (spec 059, E10-E11). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Sistemas de recepción y defensa de voleibol: editor, teoría y examen."
    />

    <!-- PWA instalable (ADR 0041). El manifiesto y los iconos salen de public/, que el
       builder copia tal cual a la raíz del output. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#090b14" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- iOS solo necesita esto para instalar; ignora el manifiesto para el modo standalone. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="InterZone" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
