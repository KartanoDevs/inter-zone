<div class="app-tablero">
  <app-barra-sistemas
    [sistemas]="opcionesSistema()"
    [sistemaActivoId]="store.sistemaActivoId()"
    (elegir)="elegirSistema($event)"
    (crear)="abrirCrear()"
    (editar)="abrirEditar()"
    (borrar)="pedirBorrado()"
  ></app-barra-sistemas>

  <app-selector-rotacion
    [rotaciones]="estadosRotacion()"
    [rotacionActiva]="store.rotacionActiva()"
    (seleccionar)="seleccionarRotacion($event)"
  ></app-selector-rotacion>

  @if (esDefensa()) {
    <app-selector-via [viaActiva]="store.viaActiva()" (seleccionar)="seleccionarVia($event)"></app-selector-via>
  }

  <div class="app-tablero__campo-envoltorio">
    <div class="app-tablero__campo">
      <app-pista
        [fichas]="fichas()"
        [idArrastrada]="idArrastrada()"
        [mostrarPosicion]="!store.ayudaPosicionDesactivada()"
        [mostrarNumerosMetros]="store.mostrarNumerosMetros()"
        [mostrarRival]="esDefensa()"
        [viaActiva]="store.viaActiva()"
        [mostrarZonas]="esDefensa()"
        [celdasVistaConjunto]="celdasVistaConjunto()"
        [leyendaVistaConjunto]="leyendaVistaConjunto()"
        [indiceColorSeleccionado]="indiceColorSeleccionado()"
        (fichaAgarrada)="onAgarrarFicha($event)"
        (rivalAgarrado)="onAgarrarRival($event)"
        (fondoAgarrado)="iniciarPintado($event)"
        (abrirAjustes)="abrirAjustes()"
      ></app-pista>
      <app-panel-validacion
        [completo]="completo()"
        [infracciones]="infracciones()"
        [avisos]="avisos()"
      ></app-panel-validacion>
    </div>
  </div>

  <app-paleta-jugadores [pendientes]="pendientesChips()" (agarrar)="onAgarrarPaleta($event)"></app-paleta-jugadores>

  <app-panel-ensenanza
    [titulo]="tituloEnsenanza()"
    [texto]="store.explicacionMostrada()"
    (guardar)="guardarExplicacion($event)"
  ></app-panel-ensenanza>

  <div class="app-tablero__acciones">
    <button type="button" class="app-boton app-boton--secundario" (click)="vaciarRotacion()">Vaciar</button>
    <button type="button" class="app-boton app-boton--primario" [disabled]="!store.puedeGuardar()" (click)="guardar()">
      Guardar rotación
    </button>
  </div>

  @if (arrastre(); as a) {
    <div class="app-tablero__fantasma" [style.left.px]="a.clientX" [style.top.px]="a.clientY">{{ a.etiqueta }}</div>
  }

  @if (store.cambioPendiente(); as pendiente) {
    <app-dialogo-confirmacion
      titulo="Cambios sin guardar"
      [mensaje]="
        pendiente.tipo === 'rotacion'
          ? 'Esta rotación tiene cambios sin guardar. Si cambias de rotación se perderán.'
          : 'Esta rotación tiene cambios sin guardar. Si cambias de sistema se perderán.'
      "
      textoConfirmar="Descartar y continuar"
      (confirmar)="confirmarCambio()"
      (cancelar)="cancelarCambio()"
    ></app-dialogo-confirmacion>
  }

  @if (dialogoSistema(); as modo) {
    <app-dialogo-sistema
      [titulo]="modo === 'crear' ? 'Nuevo sistema' : 'Renombrar sistema'"
      [nombreInicial]="modo === 'editar' ? (store.sistemaActivo()?.nombre ?? '') : ''"
      [mostrarTipo]="modo === 'crear'"
      (confirmar)="confirmarDialogoSistema($event)"
      (cancelar)="cancelarDialogoSistema()"
    ></app-dialogo-sistema>
  }

  @if (confirmandoBorrado()) {
    <app-dialogo-confirmacion
      titulo="Borrar sistema"
      [mensaje]="'¿Borrar «' + (store.sistemaActivo()?.nombre ?? '') + '»? No se puede deshacer.'"
      textoConfirmar="Borrar"
      (confirmar)="confirmarBorrado()"
      (cancelar)="cancelarBorrado()"
    ></app-dialogo-confirmacion>
  }

  @if (ajustesAbierto()) {
    <app-dialogo-ajustes
      [rotacion]="store.rotacionActiva()"
      [tieneLibero]="tieneLibero()"
      [opcionesLibero]="opcionesSustitutoLibero()"
      [sustitutoActual]="sustitutoLiberoActual()"
      [validacionDesactivada]="store.validacionDesactivada()"
      [ayudaPosicionDesactivada]="store.ayudaPosicionDesactivada()"
      [ordenRotacionCronologico]="store.ordenRotacionCronologico()"
      [mostrarNumerosMetros]="store.mostrarNumerosMetros()"
      (cambiarSustituto)="cambiarSustitutoLibero($event)"
      (alternarValidacion)="alternarValidacion()"
      (alternarAyudaPosicion)="alternarAyudaPosicion()"
      (alternarOrdenRotacion)="alternarOrdenRotacion()"
      (alternarMostrarNumerosMetros)="alternarMostrarNumerosMetros()"
      (cerrar)="cerrarAjustes()"
    ></app-dialogo-ajustes>
  }
</div>
