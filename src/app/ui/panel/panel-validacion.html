@if (visible()) {
  <div class="app-badge" [class.app-badge--aviso]="hayAviso()">
    <span class="app-badge__icono" aria-hidden="true">!</span>
    <span class="app-badge__texto">
      {{ hayFalta() ? 'FALTA DE POSICIÓN' : 'AL LÍMITE' }}
      <span class="app-badge__jugadores">{{ etiquetas() }}</span>
    </span>
  </div>
}
