<details class="app-ensenanza" open>
  <summary class="app-ensenanza__resumen">
    <span class="app-ensenanza__titulo">{{ titulo() }}</span>
    <span class="app-ensenanza__chevron" aria-hidden="true"></span>
  </summary>

  <div class="app-ensenanza__cuerpo">
    <p class="app-ensenanza__texto">{{ texto() || 'Sin explicación todavía.' }}</p>
    <button type="button" class="app-boton app-boton--secundario" (click)="iniciarEdicion()">Editar</button>
  </div>
</details>

@if (editando()) {
  <app-modal [titulo]="titulo()" (cerrar)="cancelar()">
    <textarea
      class="app-ensenanza__campo"
      rows="3"
      [value]="borrador()"
      (input)="borrador.set($any($event.target).value)"
      placeholder="¿Por qué se coloca aquí?"
    ></textarea>
    <ng-container acciones>
      <button type="button" class="app-boton app-boton--secundario" (click)="cancelar()">Cancelar</button>
      <button type="button" class="app-boton app-boton--primario" (click)="confirmar()">Guardar</button>
    </ng-container>
  </app-modal>
}
