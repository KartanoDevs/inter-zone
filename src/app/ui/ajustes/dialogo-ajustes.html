<app-modal [titulo]="'Ajustes · R' + rotacion()" (cerrar)="cerrar.emit()">
  @if (tieneLibero()) {
    <label class="app-ajustes__campo">
      Líbero sustituye a
      <select (change)="onCambiarSustituto($event)">
        @for (opcion of opcionesLibero(); track opcion.id ?? '') {
          <option [value]="opcion.id ?? ''" [selected]="opcion.id === sustitutoActual()">{{ opcion.etiqueta }}</option>
        }
      </select>
    </label>
  }

  <label class="app-ajustes__check">
    <input type="checkbox" [checked]="validacionDesactivada()" (change)="alternarValidacion.emit()" />
    Desactivar validación de posiciones
  </label>

  <label class="app-ajustes__check">
    <input type="checkbox" [checked]="ayudaPosicionDesactivada()" (change)="alternarAyudaPosicion.emit()" />
    Ocultar la ayuda de posición (P1-P6)
  </label>

  <label class="app-ajustes__check">
    <input type="checkbox" [checked]="ordenRotacionCronologico()" (change)="alternarOrdenRotacion.emit()" />
    Pestañas de rotación en orden de juego (R1, R6, R5, R4, R3, R2)
  </label>

  <label class="app-ajustes__check">
    <input
      type="checkbox"
      [checked]="mostrarNumerosMetros()"
      (change)="alternarMostrarNumerosMetros.emit()"
    />
    Mostrar números de metros junto a la rejilla
  </label>
</app-modal>
