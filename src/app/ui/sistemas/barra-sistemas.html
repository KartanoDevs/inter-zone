<div class="app-barra-sistemas">
  <select
    class="app-barra-sistemas__select"
    aria-label="Sistema"
    [value]="sistemaActivoId()"
    (change)="onElegir($event)"
  >
    @if (sistemas().length === 0) {
      <option value="" disabled selected>Sin sistemas todavía</option>
    }
    @for (sistema of sistemas(); track sistema.id) {
      <option [value]="sistema.id">{{ sistema.nombre }}</option>
    }
  </select>

  <button type="button" class="app-boton app-boton--primario" aria-label="Crear sistema" (click)="crear.emit()">+</button>
  <button
    type="button"
    class="app-boton app-boton--terciario"
    aria-label="Renombrar sistema"
    [disabled]="!sistemaActivoId()"
    (click)="editar.emit()"
  >
    ✎
  </button>
  <button
    type="button"
    class="app-boton app-boton--destructivo"
    aria-label="Borrar sistema"
    [disabled]="!sistemaActivoId()"
    (click)="borrar.emit()"
  >
    🗑
  </button>
</div>
