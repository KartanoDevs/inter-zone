<div class="app-barra-sistemas">
  @if (sistemaActivo(); as activo) {
    <span class="app-barra-sistemas__tipo" [class.app-barra-sistemas__tipo--defensa]="activo.tipo === 'defensa'">
      {{ activo.tipo === 'defensa' ? 'DEF' : 'REC' }}
    </span>
  }
  <select class="app-barra-sistemas__select" aria-label="Sistema" [value]="sistemaActivoId()" (change)="onElegir($event)">
    @if (sistemas().length === 0) {
      <option value="" disabled selected>Sin sistemas todavía</option>
    }
    @for (sistema of sistemas(); track sistema.id) {
      <option [value]="sistema.id">{{ sistema.nombre }}</option>
    }
  </select>
  <svg class="app-barra-sistemas__flecha" viewBox="0 0 24 24" aria-hidden="true">
    <polyline points="7,10 12,15 17,10" />
  </svg>
</div>
