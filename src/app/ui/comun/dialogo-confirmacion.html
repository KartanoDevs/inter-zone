<app-modal [titulo]="titulo()" variante="alerta" rol="alertdialog" (cerrar)="cancelar.emit()">
  <p class="app-dialogo-confirmacion__mensaje">{{ mensaje() }}</p>
  <ng-container acciones>
    <button type="button" class="app-boton app-boton--secundario" (click)="cancelar.emit()">
      {{ textoCancelar() }}
    </button>
    <button type="button" class="app-boton app-boton--destructivo" (click)="confirmar.emit()">
      {{ textoConfirmar() }}
    </button>
  </ng-container>
</app-modal>
