<svg:circle class="app-ficha__circulo" [attr.r]="radio"></svg:circle>
<svg:text class="app-ficha__etiqueta" text-anchor="middle" dominant-baseline="central">{{ etiqueta() }}</svg:text>
@if (mostrarPosicion()) {
  <svg:text class="app-ficha__posicion" x="0" y="0.55" text-anchor="middle" dominant-baseline="hanging">
    <svg:tspan class="app-ficha__posicion-letra">{{ prefijoPosicion() }}</svg:tspan><svg:tspan class="app-ficha__posicion-numero">{{ cuerpoPosicion() }}</svg:tspan>
  </svg:text>
}
