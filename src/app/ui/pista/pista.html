<svg
  #svgPista
  class="app-pista"
  viewBox="-0.75 -4.05 10.5 13.8"
  preserveAspectRatio="xMidYMid meet"
  role="img"
  aria-label="Pista de voleibol con la formación de la rotación activa"
  (pointerdown)="fondoAgarrado.emit($event)"
>
  @if (mostrarZonas()) {
    <defs>
      @for (patron of patronesFranjas(); track patron.id) {
        <pattern
          [attr.id]="'app-pista__franjas-' + patron.id"
          patternUnits="userSpaceOnUse"
          [attr.width]="ladoPatron"
          [attr.height]="ladoPatron"
          patternTransform="rotate(45)"
        >
          @for (color of patron.colores; track $index) {
            <rect
              [attr.y]="$index * (ladoPatron / patron.colores.length)"
              [attr.width]="ladoPatron"
              [attr.height]="ladoPatron / patron.colores.length"
              [attr.fill]="color"
            ></rect>
          }
        </pattern>
      }
    </defs>
  }

  <rect class="app-pista__zona-libre" x="-2.5" y="0" width="14" height="12"></rect>

  <rect class="app-pista__rival" x="0" y="-4" width="9" height="4"></rect>
  <line class="app-pista__rival-ataque" x1="0" y1="-3" x2="9" y2="-3"></line>
  <rect class="app-pista__borde-rival" x="0" y="-4" width="9" height="4"></rect>

  @if (mostrarRival() && puntoRival(); as punto) {
    <g
      class="app-pista__rival-ficha"
      [attr.transform]="'translate(' + punto.x + ',' + punto.y + ')'"
      (pointerdown)="onRivalPointerDown($event)"
    >
      <circle class="app-pista__rival-circulo" r="0.35"></circle>
      <text class="app-pista__rival-etiqueta" text-anchor="middle" dominant-baseline="central">R</text>
    </g>
  }

  <rect class="app-pista__campo" x="0" y="0" width="9" height="9"></rect>

  <g class="app-pista__rejilla">
    @for (linea of lineasRejilla; track linea) {
      <line class="app-pista__rejilla-linea" [attr.x1]="linea" y1="0" [attr.x2]="linea" y2="9"></line>
      <line class="app-pista__rejilla-linea" x1="0" [attr.y1]="linea" x2="9" [attr.y2]="linea"></line>
    }
  </g>

  @if (mostrarNumerosMetros()) {
    <g class="app-pista__numeros-metros">
      @for (numero of numerosMetros; track numero) {
        <text class="app-pista__numero-metro" x="-0.15" [attr.y]="numero">{{ numero }}</text>
      }
    </g>
  }

  <line class="app-pista__ataque" x1="0" y1="3" x2="9" y2="3"></line>
  <rect class="app-pista__borde-campo" x="0" y="0" width="9" height="9"></rect>
  <line class="app-pista__red" x1="0" y1="0" x2="9" y2="0"></line>

  @if (mostrarZonas()) {
    <g class="app-pista__celdas-conjunto">
      @for (celda of celdasVistaConjunto(); track celda.columna + '-' + celda.fila) {
        <rect
          class="app-pista__celda-conjunto"
          [attr.x]="celda.columna * tamanoCelda"
          [attr.y]="celda.fila * tamanoCelda"
          [attr.width]="tamanoCelda"
          [attr.height]="tamanoCelda"
          [attr.fill]="rellenoDe(celda)"
          [attr.opacity]="opacidadDe(celda)"
        ></rect>
      }
    </g>
  }

  @for (ficha of fichas(); track ficha.id) {
    <g
      appFicha
      [punto]="ficha.punto"
      [etiqueta]="ficha.etiqueta"
      [posicion]="ficha.posicion"
      [mostrarPosicion]="mostrarPosicion()"
      [estado]="ficha.estado"
      [linea]="ficha.linea"
      [esLibero]="ficha.esLibero"
      [seleccionada]="ficha.seleccionada"
      [arrastrando]="ficha.id === idArrastrada()"
      (agarrada)="fichaAgarrada.emit({ id: ficha.id, evento: $event })"
    ></g>
  }
</svg>

@if (!leyendaAbierta()) {
  <button
    type="button"
    class="app-pista__leyenda-boton"
    aria-label="Ver leyenda de etiquetas"
    (click)="leyendaAbierta.set(true)"
  >
    ?
  </button>
}

<button type="button" class="app-pista__ajustes-boton" aria-label="Ajustes" (click)="abrirAjustes.emit()">⚙</button>

@if (mostrarZonas()) {
  <div class="app-pista__leyenda-colores">
    @for (entrada of leyendaVistaConjunto(); track entrada.etiqueta) {
      <div class="app-pista__leyenda-colores-fila">
        <span class="app-pista__leyenda-colores-muestra" [style.background]="'var(' + paleta[entrada.indiceColor] + ')'"></span>
        <span>{{ entrada.etiqueta }}</span>
      </div>
    }
  </div>
}

@if (leyendaAbierta()) {
  <app-modal titulo="Leyenda" (cerrar)="leyendaAbierta.set(false)">
    <dl class="app-pista__leyenda-lista">
      @for (entrada of entradasLeyenda; track entrada.etiqueta) {
        <div class="app-pista__leyenda-fila">
          <dt>{{ entrada.etiqueta }}</dt>
          <dd>{{ entrada.nombre }}</dd>
        </div>
      }
    </dl>
    <ng-container acciones>
      <button type="button" class="app-boton app-boton--secundario" (click)="leyendaAbierta.set(false)">Cerrar</button>
    </ng-container>
  </app-modal>
}
