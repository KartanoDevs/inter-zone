<svg
  #svgPista
  class="app-pista"
  viewBox="-0.75 -4.05 10.5 13.35"
  preserveAspectRatio="xMidYMid meet"
  role="img"
  aria-label="Pista de voleibol con la formación de la rotación activa"
  (pointerdown)="fondoAgarrado.emit($event)"
>
  @if (mostrarZonas()) {
    <defs>
      @for (patron of patronesFranjas(); track patron.id) {
        <pattern
          [attr.id]="'app-pista__franjas-' + patron.id"
          patternUnits="userSpaceOnUse"
          [attr.width]="ladoPatron"
          [attr.height]="ladoPatron"
          patternTransform="rotate(45)"
        >
          @for (color of patron.colores; track $index) {
            <rect
              [attr.y]="$index * (ladoPatron / patron.colores.length)"
              [attr.width]="ladoPatron"
              [attr.height]="ladoPatron / patron.colores.length"
              [attr.fill]="color"
            ></rect>
          }
        </pattern>
      }
      <!-- Textura de la zona de finta (spec 041, E9): mismo color de fondo que la zona de
           defensa, con esta rejilla de puntos superpuesta encima. -->
      <pattern
        id="app-pista__puntos-finta"
        patternUnits="userSpaceOnUse"
        [attr.width]="tamanoCelda / 2"
        [attr.height]="tamanoCelda / 2"
      >
        <circle
          [attr.cx]="tamanoCelda / 4"
          [attr.cy]="tamanoCelda / 4"
          [attr.r]="tamanoCelda / 10"
          class="app-pista__punto-finta"
        ></circle>
      </pattern>
    </defs>
  }

  <rect class="app-pista__zona-libre" x="-2.5" y="0" width="14" height="12"></rect>

  <rect class="app-pista__rival" x="0" y="-4" width="9" height="4"></rect>
  <line class="app-pista__rival-ataque" x1="0" y1="-3" x2="9" y2="-3"></line>
  <rect class="app-pista__borde-rival" x="0" y="-4" width="9" height="4"></rect>

  @if (mostrarRival() && puntoColocadorRival(); as puntoC) {
    <g
      class="app-pista__colocador-rival"
      [attr.transform]="'translate(' + puntoC.x + ',' + puntoC.y + ')'"
    >
      <circle class="app-pista__colocador-rival-circulo" r="0.3"></circle>
      <text class="app-pista__colocador-rival-etiqueta" text-anchor="middle" dy="0.35em">CR</text>
    </g>
  }

  @if (mostrarRival() && puntoAtacante(); as puntoA) {
    <g
      class="app-pista__rival-ficha"
      [attr.transform]="'translate(' + puntoA.x + ',' + puntoA.y + ')'"
      (pointerdown)="onRivalPointerDown($event)"
    >
      <circle class="app-pista__rival-circulo" r="0.35"></circle>
      <text class="app-pista__rival-etiqueta" text-anchor="middle" dy="0.35em">A</text>
    </g>
  }

  <rect class="app-pista__campo" x="0" y="0" width="9" height="9"></rect>

  <g class="app-pista__rejilla">
    @for (linea of lineasRejilla; track linea) {
      <line
        class="app-pista__rejilla-linea"
        [attr.x1]="linea"
        y1="0"
        [attr.x2]="linea"
        y2="9"
      ></line>
      <line
        class="app-pista__rejilla-linea"
        x1="0"
        [attr.y1]="linea"
        x2="9"
        [attr.y2]="linea"
      ></line>
    }
  </g>

  <!-- Los números de metros junto a la rejilla se ven siempre (spec 067): antes eran un ajuste
       del Editor apagado por defecto, y en Teoría y Examen no había forma de verlos. -->
  <g class="app-pista__numeros-metros">
    @for (numero of numerosMetros; track numero) {
      <text class="app-pista__numero-metro" x="-0.15" [attr.y]="numero" dy="0.35em">
        {{ numero }}
      </text>
    }
  </g>

  <line class="app-pista__ataque" x1="0" y1="3" x2="9" y2="3"></line>
  <rect class="app-pista__borde-campo" x="0" y="0" width="9" height="9"></rect>
  <line class="app-pista__red" x1="0" y1="0" x2="9" y2="0"></line>

  @for (poligono of sombra(); track $index) {
    <polygon
      class="app-pista__sombra"
      [attr.points]="puntosSvg(poligono)"
      (pointerdown)="onSombraPointerDown($event)"
    ></polygon>
  }

  @if (mostrarZonas()) {
    <g class="app-pista__celdas-conjunto">
      @for (celda of celdasVistaConjunto(); track celda.columna + '-' + celda.fila) {
        <rect
          class="app-pista__celda-conjunto"
          [attr.x]="celda.columna * tamanoCelda"
          [attr.y]="celda.fila * tamanoCelda"
          [attr.width]="tamanoCelda"
          [attr.height]="tamanoCelda"
          [attr.fill]="rellenoDe(celda)"
          [attr.opacity]="opacidadDe(celda)"
        ></rect>
      }
    </g>
    <g class="app-pista__celdas-conjunto">
      @for (
        celda of celdasFintaVistaConjunto();
        track 'finta-' + celda.columna + '-' + celda.fila
      ) {
        <rect
          class="app-pista__celda-conjunto"
          [attr.x]="celda.columna * tamanoCelda"
          [attr.y]="celda.fila * tamanoCelda"
          [attr.width]="tamanoCelda"
          [attr.height]="tamanoCelda"
          [attr.fill]="rellenoDe(celda)"
          [attr.opacity]="opacidadDe(celda)"
        ></rect>
        <rect
          class="app-pista__celda-finta-textura"
          [attr.x]="celda.columna * tamanoCelda"
          [attr.y]="celda.fila * tamanoCelda"
          [attr.width]="tamanoCelda"
          [attr.height]="tamanoCelda"
          fill="url(#app-pista__puntos-finta)"
          [attr.opacity]="opacidadDe(celda)"
        ></rect>
      }
    </g>
  }

  @for (comparada of fichasComparadas(); track $index) {
    <line
      class="app-pista__comparada-linea"
      [attr.x1]="comparada.puntoModelo.x"
      [attr.y1]="comparada.puntoModelo.y"
      [attr.x2]="comparada.puntoAlumno.x"
      [attr.y2]="comparada.puntoAlumno.y"
    ></line>
    <circle
      class="app-pista__comparada-modelo"
      [attr.cx]="comparada.puntoModelo.x"
      [attr.cy]="comparada.puntoModelo.y"
      r="0.45"
    ></circle>
  }

  @for (ficha of fichas(); track ficha.id) {
    <g
      appFicha
      [punto]="ficha.punto"
      [etiqueta]="ficha.etiqueta"
      [etiquetaPosicion]="ficha.etiquetaPosicion"
      [mostrarPosicion]="mostrarPosicion()"
      [estado]="ficha.estado"
      [linea]="ficha.linea"
      [esLibero]="ficha.esLibero"
      [seleccionada]="ficha.seleccionada"
      [arrastrando]="ficha.id === idArrastrada()"
      (agarrada)="fichaAgarrada.emit({ id: ficha.id, evento: $event })"
    ></g>
  }
</svg>

@if (!leyendaAbierta()) {
  <button
    type="button"
    class="app-pista__leyenda-boton"
    aria-label="Ver leyenda de etiquetas"
    (click)="leyendaAbierta.set(true)"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="4.6" cy="6" r="1.35" fill="currentColor" stroke="none" />
      <line x1="9" y1="6" x2="20" y2="6" />
      <circle cx="4.6" cy="12" r="1.35" fill="currentColor" stroke="none" />
      <line x1="9" y1="12" x2="20" y2="12" />
      <circle cx="4.6" cy="18" r="1.35" fill="currentColor" stroke="none" />
      <line x1="9" y1="18" x2="20" y2="18" />
    </svg>
  </button>
}

@if (leyendaAbierta()) {
  <app-modal titulo="Leyenda" (cerrar)="leyendaAbierta.set(false)">
    <dl class="app-pista__leyenda-lista">
      @for (entrada of entradasLeyenda(); track entrada.etiqueta) {
        <div class="app-pista__leyenda-fila">
          <dt>{{ entrada.etiqueta }}</dt>
          <dd>{{ entrada.nombre }}</dd>
        </div>
      }
    </dl>
    <ng-container acciones>
      <button
        type="button"
        class="app-boton app-boton--secundario"
        (click)="leyendaAbierta.set(false)"
      >
        Cerrar
      </button>
    </ng-container>
  </app-modal>
}
